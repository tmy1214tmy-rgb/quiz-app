<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 20px;
}

button {
  font-size: 18px;
  margin: 5px;
  padding: 10px;
}

.hidden {
  display: none;
}

/* 上部バー */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* 分類 */
#category {
  text-align: left;
  font-weight: bold;
}

/* 同期ボタン */
.top-bar button {
  font-size: 14px;
  padding: 5px 10px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 5px;
}

#stats {
  margin: 10px 0;
  font-weight: bold;
}
</style>

</head>
<body>

<div class="top-bar">
  <p id="category"></p>
  <button onclick="syncFromSheet()">同期</button>
</div>

<div id="stats"></div>

<h2 id="question">問題</h2>

<!-- 出題条件 -->
<select id="mode">
  <option value="all">① ◎以外</option>
  <option value="weak">② △と×のみ</option>
  <option value="wrong">③ ×のみ</option>
</select>

<select id="priorityMode">
  <option value="unanswered">① 未回答のみ</option>
  <option value="priority">② 優先順位制</option>
  <option value="random">③ 完全ランダム</option>
</select>

<br><br>

<button id="hintBtn" onclick="showHint()">ヒント</button>
<button onclick="showAnswer()">回答</button>

<p id="hint"></p>
<p id="answer"></p>
<p id="previousResult"></p>

<!-- 結果ボタン -->
<div id="resultButtons" class="hidden">
  <button onclick="setResult('◎')">◎</button>
  <button onclick="setResult('○')">○</button>
  <button onclick="setResult('△')">△</button>
  <button onclick="setResult('×')">×</button>
</div>

<br>
<button onclick="nextQuestion()">次へ</button>

<script>
let data = [];
let current = null;

const URL ="https://opensheet.elk.sh/1alNSJZeUeQSZ-zLUaCnu_5qSvCbSY6yqacYXObEChuc/test";

const GAS_URL = "https://script.google.com/macros/s/AKfycbwLDbGjxiMdFP2RrgMsyDbk_feYBCLE-PnP2TAR9Xns1muzGTyItIUWtKo_rl3yCGxf_A/exec";

// データ読み込み
async function loadData() {
  const res = await fetch(URL);
  data = await res.json();
  nextQuestion();
}

// 出題条件フィルタ
function getFilteredData() {
  const mode = document.getElementById("mode").value;

  return data.filter(q => {
    const r = localStorage.getItem(q["ID"]);

    if (!r) return true;

    if (mode === "all") return r !== "◎";
    if (mode === "weak") return r === "△" || r === "×";
    if (mode === "wrong") return r === "×";

    return true;
  });
}

// 次の問題
function nextQuestion() {
  const filtered = getFilteredData();

  if (filtered.length === 0) {
    alert("該当する問題がありません");
    return;
  }

  const mode = document.getElementById("priorityMode").value;

  let pool = [];

  if (mode === "unanswered") {
    pool = filtered.filter(q => !localStorage.getItem(q["ID"]));
  }

  else if (mode === "priority") {
    const groups = {
      unanswered: [],
      wrong: [],
      weak: [],
      ok: [],
      good: []
    };

    filtered.forEach(q => {
      const r = localStorage.getItem(q["ID"]);

      if (!r) groups.unanswered.push(q);
      else if (r === "×") groups.wrong.push(q);
      else if (r === "△") groups.weak.push(q);
      else if (r === "○") groups.ok.push(q);
      else if (r === "◎") groups.good.push(q);
    });

    pool =
      groups.unanswered.length ? groups.unanswered :
      groups.wrong.length ? groups.wrong :
      groups.weak.length ? groups.weak :
      groups.ok.length ? groups.ok :
      groups.good;
  }

  else {
    pool = filtered;
  }

  if (pool.length === 0) {
    alert("該当する問題がありません");
    return;
  }

  current = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById("previousResult").innerText = "";

  // ヒント制御
  const hint = current["ヒント"];
  document.getElementById("hintBtn").disabled = !hint || hint.trim() === "";

  document.getElementById("category").innerText = current["分類"];
  document.getElementById("question").innerText = current["問題文"];
  document.getElementById("hint").innerText = "";
  document.getElementById("answer").innerText = "";
  document.getElementById("resultButtons").classList.add("hidden");

  window.scrollTo(0, 0);
  updateStats();
}

// ヒント
function showHint() {
  document.getElementById("hint").innerText = current["ヒント"];
}

// 回答
function showAnswer() {
  document.getElementById("answer").innerText = current["回答"];
  document.getElementById("resultButtons").classList.remove("hidden");

  const prev = localStorage.getItem(current["ID"]);

  if (prev) {
    document.getElementById("previousResult").innerText = "前回結果：" + prev;
  } else {
    document.getElementById("previousResult").innerText = "前回結果：なし";
  }
}

// 結果保存
function setResult(r) {

  console.log("送信:", current["ID"], r); // ログ追加

  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      id: current["ID"],
      result: r
    })
  });

  localStorage.setItem(current["ID"], r);

  nextQuestion();
}

// Sheets → ローカル同期
async function syncFromSheet() {
  if (!confirm("Google Sheetsの結果を取り込みますか？（上書きされます）")) return;

  try {
    const res = await fetch(URL);
    const sheetData = await res.json();

    data = sheetData; // ←ここ重要（問題も更新）

    sheetData.forEach(q => {
      const id = q["ID"];
      const result = q["結果"];

      if (result && result !== "") {
        localStorage.setItem(id, result);
      } else {
        localStorage.removeItem(id);
      }
    });

    alert("同期完了！");
    updateStats();
    nextQuestion();

  } catch (e) {
    alert("同期失敗");
    console.error(e);
  }
}

function updateStats() {
  let total = data.length;
  let counts = { "◎": 0, "○": 0, "△": 0, "×": 0 };

  data.forEach(q => {
    const r = localStorage.getItem(q["ID"]);
    if (counts[r] !== undefined) {
      counts[r]++;
    }
  });

  document.getElementById("stats").innerText =
    `全問題：${total}　◎：${counts["◎"]}　○：${counts["○"]}　△：${counts["△"]}　×：${counts["×"]}`;
}

loadData();

async function loadData() {
  const res = await fetch(URL);
  data = await res.json();

  updateStats(); // ★ここ追加
  nextQuestion();
}
</script>

</body>
</html>
